# Локальная инфраструктура CRM. Имя, порт и volume отдельные от RehubPro.
name: rehubpro-crm
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rehubpro_crm
      POSTGRES_USER: rehubpro_crm
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:?Run scripts/setup.sh first}
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - crm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehubpro_crm -d rehubpro_crm"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  crm_postgres:
