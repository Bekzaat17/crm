<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>RehubPro CRM</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="brand"
        ><img src="icons/icon32.png" alt="" width="24" height="24" /> RehubPro
        CRM</span
      >
      <button id="logout" type="button" class="link" hidden>Выйти</button>
    </header>
    <p id="account" class="muted"></p>

    <form id="login-form" hidden>
      <p class="muted">Войдите один раз — дальше расширение работает само.</p>
      <button type="submit">Войти в RehubPro CRM</button>
    </form>

    <section id="chat" hidden>
      <h2 id="chat-title"></h2>
      <p id="chat-meta" class="muted"></p>
      <div id="tracked" hidden>
        <p class="ok" id="tracked-lead"></p>
        <button id="sync" type="button">Синхронизировать сейчас</button>
        <button id="untrack" type="button" class="secondary">
          Не отслеживать
        </button>
      </div>
      <div id="untracked" hidden>
        <label
          >Обращение
          <input id="lead-search" placeholder="Поиск по клиенту или названию"
        /></label>
        <select id="lead" aria-label="Обращение"></select>
        <p id="match-note" class="muted"></p>
        <label class="check"
          ><input id="track" type="checkbox" /> Отслеживать этот чат</label
        >
        <p class="muted small">
          Новые сообщения будут передаваться автоматически, пока чат открыт в
          браузере.
        </p>
      </div>
      <ul id="warnings" class="warnings"></ul>
    </section>

    <p id="status" class="status" role="status"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
